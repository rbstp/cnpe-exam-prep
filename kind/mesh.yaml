# Second, smaller cluster. Service meshes rewrite networking at a low level;
# keeping them off the main cluster means a broken mesh never costs you your
# GitOps/observability state. Uses kind's default CNI deliberately — Cilium +
# Istio ambient on the same host is a rabbit hole you don't need before an exam.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mesh
nodes:
  - role: control-plane
    image: __IMAGE__
  - role: worker
    image: __IMAGE__
