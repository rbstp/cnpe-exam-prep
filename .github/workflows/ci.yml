name: CI

# The deploy workflow runs these same site checks, but only on push to master,
# by which point a broken PR has already merged. This runs the identical gate
# at PR time (the assertions live in curriculum/tools/check-site.sh, shared by
# both), a browser pass over the staged site (curriculum/tools/browser-checks/,
# also shared with the deploy), a JSDoc type-check of the console's scripts
# (tsc --noEmit against curriculum/assets/cnpe.d.ts; the site itself stays
# plain JS with no build step), plus shellcheck over the lab scripts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Study console builds clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the drill data is in sync with the self-check panels
        working-directory: curriculum
        run: python3 tools/extract-drill.py --check

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      - name: Check the staged site
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: curriculum/tools/check-site.sh "${{ runner.temp }}/_site"

  browser:
    name: Study console behaves in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      # Playwright is a CI-only dependency, pinned so a release cannot turn
      # this gate red on its own: no manifest or lockfile is written, only an
      # untracked node_modules, and the console itself stays dependency-free.
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Drive the staged site
        run: node curriculum/tools/browser-checks/run.js "${{ runner.temp }}/_site"

  typecheck:
    name: Study console type-checks via JSDoc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same CI-only, pinned, --no-save arrangement as the browser job (one
      # npm install: a second --no-save run prunes the first). tsc only reads
      # the .js files against curriculum/assets/cnpe.d.ts; nothing is emitted
      # and the console stays dependency-free. playwright is here purely for
      # its type declarations, so its browsers are never installed.
      - name: Install TypeScript and the type sources
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-package-lock typescript@5.9.3 @types/node@24 playwright@1.56.1

      - name: Type-check the console assets
        run: npx tsc -p curriculum/jsconfig.json

      - name: Type-check the browser checks
        run: npx tsc -p curriculum/tools/browser-checks/tsconfig.json

  shellcheck:
    name: ShellCheck the lab scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # warning-and-up gates the merge; info/style stay advisory so the gate
      # trips on real quoting and logic mistakes, not formatting taste.
      - name: shellcheck
        run: shellcheck -x --severity=warning scripts/*.sh curriculum/tools/*.sh
