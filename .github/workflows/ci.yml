name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Study console builds clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the drill data is in sync with the self-check panels
        working-directory: curriculum
        run: python3 tools/extract-drill.py --check

      - name: Check the shipped fonts still cover the site's characters
        working-directory: curriculum
        run: python3 tools/subset-fonts.py --check

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      - name: Check the staged site
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: curriculum/tools/check-site.sh "${{ runner.temp }}/_site"

  browser:
    name: Study console behaves in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright

      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Drive the staged site
        run: node curriculum/tools/browser-checks/run.js "${{ runner.temp }}/_site"

  merge:
    name: Progress merge behaves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Drive the merge over plain objects
        run: node curriculum/tools/merge-test.mjs

      - name: Drive the command-block highlighting over plain strings
        run: node curriculum/tools/syntax-test.mjs

      - name: Drive the quest's command interpreter over every scenario
        run: node curriculum/tools/game-sim-test.mjs

  worker:
    name: Sync Worker behaves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Drive the Worker against a stub D1
        run: node sync/test.mjs

  typecheck:
    name: Study console type-checks via JSDoc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install TypeScript and the type sources
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Type-check the console assets
        run: npx tsc -p curriculum/jsconfig.json

      - name: Type-check the browser checks
        run: npx tsc -p curriculum/tools/browser-checks/tsconfig.json

      - name: Type-check the progress-sync Worker
        run: npx tsc -p sync/jsconfig.json

  shellcheck:
    name: ShellCheck the lab scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: shellcheck
        run: shellcheck -x --severity=warning scripts/*.sh curriculum/tools/*.sh
