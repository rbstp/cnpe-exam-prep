name: Cluster smoke

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-core:
    name: kind core comes up
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLUSTER: cnpe-ci
      CNI: kindnet
      CNPE_SMOKE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install the latest kind release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -er .tag_name)
          base="https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64"
          curl -fsSL "$base" -o "${RUNNER_TEMP}/kind"
          curl -fsSL "${base}.sha256sum" -o "${RUNNER_TEMP}/kind.sha256sum"
          expected=$(awk '{print $1}' "${RUNNER_TEMP}/kind.sha256sum")
          actual=$(sha256sum "${RUNNER_TEMP}/kind" | awk '{print $1}')
          test "$actual" = "$expected"
          sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind
          kind version

      - name: Create local configuration
        run: cp lab.env.example lab.env

      - name: Start the lab's core cluster
        run: make up

      - name: Exercise scheduling, DNS, Services, and audit logging
        shell: bash
        run: |
          set -euo pipefail
          kubectl get --raw='/readyz?verbose'
          kubectl wait --for=condition=Ready nodes --all --timeout=3m
          kubectl apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: echo
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: echo
            template:
              metadata:
                labels:
                  app: echo
              spec:
                containers:
                  - name: echo
                    image: registry.k8s.io/e2e-test-images/agnhost:2.53
                    args: ["netexec", "--http-port=8080"]
                    ports:
                      - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: echo
          spec:
            selector:
              app: echo
            ports:
              - port: 80
                targetPort: 8080
          YAML
          kubectl rollout status deployment/echo --timeout=3m
          kubectl run probe --image=busybox:1.36.1 --restart=Never --command -- \
            sh -ceu 'nslookup kubernetes.default.svc.cluster.local && wget -qO- http://echo.default.svc.cluster.local/hostname'
          for _ in $(seq 1 60); do
            phase=$(kubectl get pod probe -o jsonpath='{.status.phase}')
            case "$phase" in
              Succeeded) break ;;
              Failed) kubectl logs probe; exit 1 ;;
            esac
            sleep 2
          done
          test "$(kubectl get pod probe -o jsonpath='{.status.phase}')" = Succeeded
          kubectl logs probe
          docker exec cnpe-ci-control-plane test -s /var/log/kubernetes/audit.log

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl describe nodes || true
          docker logs cnpe-ci-control-plane --tail 200 || true

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER"
