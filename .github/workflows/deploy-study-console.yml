name: Deploy Study Console

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # CI also runs on pull requests, and every completion used to spawn a deploy
    # run that the job condition below then skipped. This filter is on the branch
    # of the CI run that completed, so only CI for master reaches this workflow;
    # the condition stays as the second guard on the run's event and outcome.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      # No ref, so this takes the head of the default branch. It used to name the
      # CI run's head_sha, to publish exactly the commit CI had validated. Scorecard
      # reads any workflow_run job that checks out workflow_run.head_sha as an
      # untrusted checkout, because in the general case that SHA can be a fork's
      # code meeting a privileged token. It cannot here: the trigger filters on
      # master and the job condition demands a successful push on master. The
      # check is syntactic and does not read those guards, and the two commits
      # differ only when a second push lands while a deploy is running, which the
      # pages concurrency group already serializes. Not worth a standing finding.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
