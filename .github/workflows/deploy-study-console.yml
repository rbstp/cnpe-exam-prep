name: Deploy Study Console

on:
  push:
    branches: [master]
    paths:
      - 'curriculum/**'
      - '.github/workflows/deploy-study-console.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the drill data is in sync with the self-check panels
        working-directory: curriculum
        run: python3 tools/extract-drill.py --check

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      # The assertions live in check-site.sh, shared with the PR-time CI
      # workflow, so the deploy gate and the merge gate cannot drift apart.
      - name: Check the staged site
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: curriculum/tools/check-site.sh "${{ runner.temp }}/_site"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
