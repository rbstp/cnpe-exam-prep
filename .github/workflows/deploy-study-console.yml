name: Deploy Study Console

on:
  push:
    branches: [master]
    paths:
      - 'curriculum/**'
      - '.github/workflows/deploy-study-console.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check the drill data is in sync with the self-check panels
        working-directory: curriculum
        run: python3 tools/extract-drill.py --check

      - name: Stage the site
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      - name: Check the staged site
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: curriculum/tools/check-site.sh "${{ runner.temp }}/_site"

      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright

      - name: Install Playwright Chromium
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Drive the staged site in a real browser
        run: node curriculum/tools/browser-checks/run.js "${{ runner.temp }}/_site"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
