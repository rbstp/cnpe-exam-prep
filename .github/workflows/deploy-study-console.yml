name: Deploy Study Console

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # workflow_run takes no paths filter, so the commit decides. Unclear publishes.
      - name: Decide whether this commit changes the site
        id: scope
        run: |
          if [ "${{ github.event_name }}" != workflow_run ] ||
             ! git rev-parse --verify -q HEAD^ >/dev/null ||
             ! git diff --quiet HEAD^ HEAD -- curriculum .github/workflows/deploy-study-console.yml; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing under curriculum/ changed; leaving the published site alone.'
          fi

      - name: Stage the site
        if: steps.scope.outputs.publish == 'true'
        working-directory: curriculum
        env:
          SITE_DOMAIN: cnpe.rbstp.dev
        run: tools/stage-site.sh "${{ runner.temp }}/_site"

      - name: Setup Pages
        if: steps.scope.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: steps.scope.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
