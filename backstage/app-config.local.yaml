# Dropped into the Backstage app root by scripts/80-backstage.sh.

# Repo URLs say gitea.lab:3000, the name pods use. Backstage runs on the host, which
# reaches the same Gitea on its published port, so API calls and pushes go there.
# The second entry lets the catalog read back the localhost URLs the publish returns.
integrations:
  gitea:
    - host: gitea.lab:3000
      baseUrl: http://localhost:3001
      username: lab
      password: REPLACED_FROM_LAB_ENV
    - host: localhost:3001
      baseUrl: http://localhost:3001
      username: lab
      password: REPLACED_FROM_LAB_ENV

# Arrays replace rather than merge, so the create-app defaults are repeated here.
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/golden-path/template.yaml
      rules:
        - allow: [Template]
