# Dropped into the Backstage app root by scripts/80-backstage.sh.

integrations:
  gitea:
    - host: gitea.lab:3000
      baseUrl: http://gitea.lab:3000
      username: lab
      password: REPLACED_FROM_LAB_ENV

# Arrays replace rather than merge, so the create-app defaults are repeated here.
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/golden-path/template.yaml
      rules:
        - allow: [Template]
