# Dropped into the Backstage app root by scripts/80-backstage.sh.
# `yarn dev` loads app-config.yaml then app-config.local.yaml on top.

integrations:
  gitea:
    - host: gitea.lab:3000
      baseUrl: http://gitea.lab:3000
      username: lab
      password: REPLACED_FROM_LAB_ENV   # 80-backstage.sh substitutes GITEA_PASS here

# NOTE: arrays replace rather than merge, so the create-app defaults are
# repeated here. Drop one and its entities disappear from the catalog.
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/golden-path/template.yaml
      rules:
        - allow: [Template]
