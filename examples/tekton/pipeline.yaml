# Clone, scan, build, and push to the local registry.
apiVersion: tekton.dev/v1
kind: Task
metadata: { name: trivy-scan }
spec:
  params:
    - { name: image, type: string }
  workspaces:
    - { name: source }
  results:
    - { name: sbom-digest, description: "digest of generated SBOM" }
  steps:
    - name: scan
      image: aquasec/trivy:latest
      script: |
        #!/bin/sh
        # --insecure: the lab registry speaks plain http
        trivy image --insecure --exit-code 1 --severity HIGH,CRITICAL --no-progress $(params.image)
    - name: sbom
      image: aquasec/trivy:latest
      script: |
        #!/bin/sh
        trivy image --insecure --format cyclonedx --output $(workspaces.source.path)/sbom.json $(params.image)
        sha256sum $(workspaces.source.path)/sbom.json | cut -d' ' -f1 | tr -d '\n' > $(results.sbom-digest.path)
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata: { name: build-and-scan }
spec:
  params:
    - { name: repo-url, type: string }
    # Pipeline pods push from inside the cluster, so kind-registry:5000, not localhost:5001.
    - { name: image,    type: string, default: "kind-registry:5000/demo:v1" }
  workspaces:
    - { name: shared }
  tasks:
    - name: clone
      taskRef: { name: git-clone }
      workspaces: [{ name: output, workspace: shared }]
      params: [{ name: url, value: $(params.repo-url) }]
    - name: build
      runAfter: [clone]
      taskRef: { name: kaniko }
      workspaces: [{ name: source, workspace: shared }]
      params:
        - { name: IMAGE, value: $(params.image) }
        - { name: EXTRA_ARGS, value: ["--insecure", "--skip-tls-verify"] }
    - name: scan
      runAfter: [build]
      taskRef: { name: trivy-scan }
      workspaces: [{ name: source, workspace: shared }]
      params: [{ name: image, value: $(params.image) }]
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata: { generateName: build-and-scan- }
spec:
  pipelineRef: { name: build-and-scan }
  params:
    - { name: repo-url, value: "http://gitea.lab:3000/lab/demo-app.git" }
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }
