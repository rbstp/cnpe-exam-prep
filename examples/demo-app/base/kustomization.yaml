apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# 'commonLabels' is deprecated in kustomize v5. The replacement is 'labels', where
# includeSelectors: true reproduces the old behaviour of also patching selectors.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: demo-app
