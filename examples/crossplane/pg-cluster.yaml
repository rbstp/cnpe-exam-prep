# Will not become Ready in team-a: default-deny blocks pod egress to the API server.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: pg, namespace: team-a }
spec:
  instances: 2
  storage: { size: 1Gi }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
