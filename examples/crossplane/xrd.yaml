# Crossplane v2: XRs are namespaced and there are no Claims any more.
# If your installed version disagrees, check: kubectl explain compositeresourcedefinition
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: appenvironments.platform.lab.local
spec:
  scope: Namespaced
  group: platform.lab.local
  names:
    kind: AppEnvironment
    plural: appenvironments
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                team:        { type: string, description: "Owning team" }
                cpuQuota:    { type: string, default: "2" }
                memoryQuota: { type: string, default: "4Gi" }
              required: [team]
            status:
              type: object
              properties:
                namespace: { type: string }
