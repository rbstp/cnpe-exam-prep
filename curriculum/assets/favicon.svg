<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The console's badge: three stacked platform layers inside a hexagon, the
       same drawing as sync/oauth-app-logo.svg. The hex carries its own ground, a
       step above the console's ink, so it separates from a dark tab and the
       paper-cream top layer reads on light and dark tabs alike. -->
  <polygon points="12.00,0.60 21.87,6.30 21.87,17.70 12.00,23.40 2.13,17.70 2.13,6.30" fill="#3D392F"/>
  <g transform="translate(12 12) scale(.72) translate(-12 -12)" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20.4 17 12 21.4 3.6 17" stroke="#8FB0E4"/>
    <path d="M20.4 12 12 16.4 3.6 12" stroke="#8FBF74"/>
    <path d="M12 2.6 20.4 7 12 11.4 3.6 7z" stroke="#E6DFD0"/>
  </g>
</svg>
