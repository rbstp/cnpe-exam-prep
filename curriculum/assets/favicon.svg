<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Three stacked platform layers; warm mid-tones read on light and dark tabs
       alike, with the middle layer in verdigris as the accent. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFA351"/>
      <stop offset="100%" stop-color="#D08453"/>
    </linearGradient>
  </defs>
  <path d="M12 2.6 20.4 7 12 11.4 3.6 7z" fill="none" stroke="url(#g)" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M20.4 12 12 16.4 3.6 12" fill="none" stroke="#59A79C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20.4 17 12 21.4 3.6 17" fill="none" stroke="url(#g)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
