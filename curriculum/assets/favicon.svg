<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The console's mark: three stacked platform layers in the accent gold, the
       same paths as the masthead mark in app.js. The masthead draws them inside an
       unfilled hexagon at .72 scale; a 16px tab has no room to spare, so here they
       fill the box. The two golds are the accent from style.css: the dark theme's
       for a dark tab strip, the light theme's for a light one. -->
  <style>
    path { stroke: #cca152; }
    @media (prefers-color-scheme: light) { path { stroke: #7d5914; } }
  </style>
  <g fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20.4 17 12 21.4 3.6 17"/>
    <path d="M20.4 12 12 16.4 3.6 12"/>
    <path d="M12 2.6 20.4 7 12 11.4 3.6 7z"/>
  </g>
</svg>
